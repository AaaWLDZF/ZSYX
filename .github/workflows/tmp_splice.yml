name: tmp splice
on:
  push:
    paths: ['_assemble/splice.py', '.github/workflows/tmp_splice.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  splice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Splice game.js
        run: python3 _assemble/splice.py
      - name: Fix index.html curly quotes
        run: |
          python3 -c "
          data = open('index.html', 'rb').read()
          fixed = data.replace(chr(0x201c).encode(), b'\x22').replace(chr(0x201d).encode(), b'\x22')
          open('index.html', 'wb').write(fixed)
          print('index.html bytes:', len(data), '->', len(fixed))
          "
      - name: Show result sizes
        run: |
          python3 -c "
          import hashlib
          for p in ['js/game.js', 'index.html']:
              d = open(p, 'rb').read()
              print(p, len(d), hashlib.sha1(b'blob %d\x00' % len(d) + d).hexdigest())
          "
      - name: Commit and push
        run: |
          git config user.name "splice-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/game.js index.html
          git diff --cached --quiet && echo "no change" || (git commit -m "fix: save system + dynamic ladder + index quotes" && git push)
