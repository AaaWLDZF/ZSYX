name: Assemble data.js from parts
on:
  push:
    paths:
      - '_assemble/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble and clean up
        run: |
          cat _assemble/part1 _assemble/part2 _assemble/part3 _assemble/part4 _assemble/part5 > js/data.js
          rm -rf _assemble .github/workflows/assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: assemble js/data.js from parts and remove temp files"
          git push
